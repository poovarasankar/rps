<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Arena - Multiplayer Stone Paper Scissors</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #b8b8b8;
            font-size: 1.1em;
        }

        .screen {
            display: none;
            text-align: center;
        }

        .active {
            display: block;
        }

        .btn {
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            min-width: 200px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 120px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .choice-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #667eea;
        }

        .choice-btn.selected {
            border-color: #4ecdc4;
            background: rgba(78, 205, 196, 0.2);
            transform: scale(1.05);
        }

        .choice-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .choice-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }

        .timer {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
            margin: 20px 0;
            transition: all 0.3s ease;
        }

        .timer.warning {
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
        }

        .player-score {
            text-align: center;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #4ecdc4;
        }

        .round-result {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-display {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0;
        }

        .choice-item {
            text-align: center;
        }

        .choice-emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .winner {
            color: #4ecdc4;
            font-weight: bold;
        }

        .draw {
            color: #ffd93d;
        }

        .vs {
            font-size: 1.5em;
            display: flex;
            align-items: center;
            color: #ff6b6b;
        }

        .status-message {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RPS ARENA</h1>
            <p>Battle it out in real-time Stone Paper Scissors!</p>
        </div>

        <!-- Main Menu -->
        <div id="menuScreen" class="screen active">
            <div style="margin: 40px 0;">
                <i class="fas fa-fist-raised" style="font-size: 4em; color: #4ecdc4; margin-bottom: 20px;"></i>
                <h2 style="margin-bottom: 10px;">Ready to Battle?</h2>
                <p style="color: #b8b8b8; margin-bottom: 30px;">Challenge players worldwide in real-time matches</p>
            </div>
            <button class="btn" onclick="findMatch()">
                <i class="fas fa-search"></i> Find Match
            </button>
        </div>

        <!-- Matchmaking Screen -->
        <div id="searchingScreen" class="screen">
            <div style="margin: 40px 0;">
                <div class="loading" style="width: 40px; height: 40px; margin: 0 auto 20px;"></div>
                <h2 id="searchingText">Searching for opponent...</h2>
                <p id="queuePosition" style="color: #b8b8b8; margin-top: 10px;"></p>
            </div>
            <button class="btn btn-secondary" onclick="cancelMatchmaking()">
                <i class="fas fa-times"></i> Cancel
            </button>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div class="game-info">
                <div>Room: <span id="roomId" style="color: #4ecdc4;"></span></div>
                <div>Round: <span id="roundNumber">1</span></div>
            </div>

            <div class="score-board">
                <div class="player-score">
                    <div>YOU</div>
                    <div class="score-value" id="playerScore">0</div>
                </div>
                <div class="vs">VS</div>
                <div class="player-score">
                    <div>OPPONENT</div>
                    <div class="score-value" id="opponentScore">0</div>
                </div>
            </div>

            <div class="timer" id="timer">15</div>

            <div class="status-message" id="gameStatus">Choose your weapon!</div>

            <div class="choices">
                <div class="choice-btn" onclick="makeChoice('stone')" id="choice-stone">
                    <div class="choice-icon">🪨</div>
                    <div>Stone</div>
                </div>
                <div class="choice-btn" onclick="makeChoice('paper')" id="choice-paper">
                    <div class="choice-icon">📄</div>
                    <div>Paper</div>
                </div>
                <div class="choice-btn" onclick="makeChoice('scissors')" id="choice-scissors">
                    <div class="choice-icon">✂️</div>
                    <div>Scissors</div>
                </div>
            </div>

            <div id="roundResult"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="screen">
            <div style="margin: 40px 0;">
                <i class="fas fa-trophy" style="font-size: 4em; color: #ffd93d; margin-bottom: 20px;"></i>
                <h2 id="gameResultText">Game Over!</h2>
                <div id="finalScore" style="margin: 20px 0; font-size: 1.2em;"></div>
            </div>
            <button class="btn" onclick="backToMenu()">
                <i class="fas fa-home"></i> Main Menu
            </button>
        </div>
    </div>

   <script>
    const socket = io("http://localhost:3000");
    let roomId = null;
    let currentRound = 1;
    let timerInterval = null;
    let hasChosen = false;
    let playerNumber = null; // 1 or 2 — set when match is found

    // Emoji mappings
    const choiceEmojis = {
        stone: "🪨",
        paper: "📄",
        scissors: "✂️",
        timeout: "⏰"
    };

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    function resetGameState() {
        roomId = null;
        currentRound = 1;
        hasChosen = false;
        playerNumber = null;
        clearInterval(timerInterval);

        // Reset UI
        document.getElementById('playerScore').textContent = '0';
        document.getElementById('opponentScore').textContent = '0';
        document.getElementById('roundNumber').textContent = '1';
        document.getElementById('roundResult').innerHTML = '';
        document.getElementById('roomId').textContent = '';

        // Reset choice buttons
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.classList.remove('selected');
            btn.disabled = false;
        });
    }

    function findMatch() {
        resetGameState();
        socket.emit("findMatch");
        showScreen("searchingScreen");
    }

    function cancelMatchmaking() {
        socket.emit("cancelMatchmaking");
        showScreen("menuScreen");
    }

    function makeChoice(choice) {
        if (!roomId || hasChosen) return;

        // Visual feedback
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.classList.remove('selected');
        });
        document.getElementById(`choice-${choice}`).classList.add('selected');

        // Disable buttons after choice
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.disabled = true;
        });

        hasChosen = true;
        socket.emit("playerChoice", { roomId, choice });
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        const timerElement = document.getElementById('timer');
        let timeLeft = seconds;

        timerElement.textContent = timeLeft;
        timerElement.className = 'timer';

        timerInterval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;

            if (timeLeft <= 5) {
                timerElement.classList.add('warning');
            }

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
            }
        }, 1000);
    }

    function backToMenu() {
        resetGameState();
        showScreen("menuScreen");
    }

    // Helper to map server-side keys (p1/p2) to local "you" and "opponent"
    function localChoice(serverData) {
        // serverData has fields p1 and p2 (strings)
        if (playerNumber === 1) {
            return { you: serverData.p1, opponent: serverData.p2 };
        } else {
            return { you: serverData.p2, opponent: serverData.p1 };
        }
    }

    function localScores(serverScore) {
        if (playerNumber === 1) {
            return { you: serverScore.p1, opponent: serverScore.p2 };
        } else {
            return { you: serverScore.p2, opponent: serverScore.p1 };
        }
    }

    // Socket event handlers
    socket.on("searching", (data) => {
        document.getElementById('searchingText').textContent = data.message;
        document.getElementById('queuePosition').textContent =
            `Position in queue: ${data.queuePosition}`;
    });

    socket.on("matchFound", (data) => {
        roomId = data.roomId;
        playerNumber = data.playerNumber || 1; // server sends 1 or 2
        document.getElementById('roomId').textContent = data.roomId;
        // Optionally indicate player number:
        document.getElementById('gameStatus').textContent = `Matched! You are Player ${playerNumber}. Waiting for round to start...`;
        showScreen("gameScreen");
    });

    socket.on("roundStart", (data) => {
        currentRound = data.round;
        hasChosen = false;

        document.getElementById('roundNumber').textContent = data.round;

        // Map scores to local UI
        const mapped = localScores(data.scores);
        document.getElementById('playerScore').textContent = mapped.you;
        document.getElementById('opponentScore').textContent = mapped.opponent;

        document.getElementById('gameStatus').textContent = 'Choose your weapon!';
        document.getElementById('roundResult').innerHTML = '';

        // Enable choice buttons
        document.querySelectorAll('.choice-btn').forEach(btn => {
            btn.classList.remove('selected');
            btn.disabled = false;
        });

        startTimer(data.timeLimit);
    });

    socket.on("choiceRegistered", (data) => {
        // This event is sent to the player who made their choice
        document.getElementById('gameStatus').textContent =
            `You chose ${data.choice} - Waiting for opponent...`;
    });

    socket.on("opponentChoiceMade", () => {
        document.getElementById('gameStatus').textContent =
            'Opponent made choice - Revealing soon...';
    });

    socket.on("roundResult", (data) => {
        clearInterval(timerInterval);
        hasChosen = false;

        // Map server choices to local labels
        const mappedChoices = localChoice({ p1: data.p1, p2: data.p2 });
        const mappedScores = localScores(data.score);

        let resultText = '';
        if (data.winner === 'draw') {
            resultText = '<span class="draw">It\'s a Draw!</span>';
        } else if (data.winner === 'timeout') {
            resultText = '<span class="draw">Time\'s Up!</span>';
        } else {
            // check if local player won
            const localWinnerKey = `p${playerNumber}`;
            if (data.winner === localWinnerKey) {
                resultText = '<span class="winner">You Win This Round! 🎉</span>';
            } else {
                resultText = '<span class="winner">Opponent Wins This Round!</span>';
            }
        }

        const resultHTML = `
            <div class="round-result">
                <h3>Round ${data.round} Result</h3>
                <div class="choice-display">
                    <div class="choice-item">
                        <div class="choice-emoji">${choiceEmojis[mappedChoices.you]}</div>
                        <div>Your Choice</div>
                    </div>
                    <div class="vs">VS</div>
                    <div class="choice-item">
                        <div class="choice-emoji">${choiceEmojis[mappedChoices.opponent]}</div>
                        <div>Opponent</div>
                    </div>
                </div>
                <div style="margin-top: 15px; font-size: 1.2em;">
                    ${resultText}
                </div>
                <div style="margin-top: 10px;">
                    Score: You ${mappedScores.you} - ${mappedScores.opponent} Opponent
                </div>
            </div>
        `;

        document.getElementById('roundResult').innerHTML = resultHTML;
        document.getElementById('playerScore').textContent = mappedScores.you;
        document.getElementById('opponentScore').textContent = mappedScores.opponent;
    });

    socket.on("gameOver", (data) => {
        let resultText = '';
        if (data.winner === 'draw') {
            resultText = 'Game Ended in Draw!';
        } else {
            const localWinnerKey = `p${playerNumber}`;
            if (data.winner === localWinnerKey) {
                resultText = 'You Won the Game! 🏆';
            } else {
                resultText = 'You Lost the Game!';
            }
        }

        // Map final scores to local view
        const mappedFinal = localScores(data.finalScore || { p1: 0, p2: 0 });

        document.getElementById('gameResultText').textContent = resultText;
        document.getElementById('finalScore').innerHTML = `
            <div>Final Score: <strong>${mappedFinal.you} - ${mappedFinal.opponent}</strong></div>
            <div>Total Rounds: ${data.totalRounds}</div>
        `;
        showScreen("gameOverScreen");
    });

    socket.on("opponentLeft", (message) => {
        alert(message);
        backToMenu();
    });

    socket.on("matchmakingCancelled", () => {
        showScreen("menuScreen");
    });

    socket.on("error", (error) => {
        console.error('Socket error:', error);
        alert('Error: ' + error);
    });

    // Handle page unload
    window.addEventListener('beforeunload', () => {
        if (socket) socket.disconnect();
    });
</script>

</body>
</html>
